name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A custom domain serves from the root; a project page serves from
      # /<repo>. Adding public/CNAME is therefore the only change needed
      # to move this site onto crm.saatvikminchem.com.
      - name: Resolve base path
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "Custom domain found: $(cat public/CNAME) — building for root"
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "No CNAME — building for the /easycrm-landing project path"
            echo "value=/easycrm-landing" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.value }}
      # Stop GitHub Pages' Jekyll from dropping the _next/ directory
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
